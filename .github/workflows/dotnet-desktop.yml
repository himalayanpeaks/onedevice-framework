name: Build, Test and Publish NuGet

# - Pull requests / pushes to main: build, test and pack (packages kept as a workflow artifact).
# - Pushing a version tag (e.g. 2.4.0 or v2.4.0): additionally pushes the packages to nuget.org.
#   Uses nuget.org Trusted Publishing (OIDC): no API key secret needed. A trusted publishing
#   policy for this repository and workflow file must exist on nuget.org.

on:
  push:
    branches: ["main"]
    tags:
      - '*.*.*'
      - 'v*.*.*'
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  SOLUTION: OneDevice.Framework/OneDevice.Framework.sln
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
              $ver = "${{ github.ref_name }}".TrimStart('v')
          } else {
              $lastTag = git describe --tags --abbrev=0 2>$null
              if ($lastTag) {
                  $count = git rev-list --count "$lastTag..HEAD"
                  $ver = "$($lastTag.TrimStart('v'))-ci.$count"
              } else {
                  $count = git rev-list --count HEAD
                  $ver = "0.0.1-ci.$count"
              }
          }
          "PackageVersion=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Package version: $ver"

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore /p:Version=${{ steps.version.outputs.PackageVersion }}

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack ${{ env.SOLUTION }} --configuration Release --no-build --output ./packages /p:PackageVersion=${{ steps.version.outputs.PackageVersion }}

      - name: Upload packages
        uses: actions/upload-artifact@v5
        with:
          name: nuget-packages
          path: ./packages/*.nupkg

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      id-token: write   # required for nuget.org Trusted Publishing (OIDC)
      contents: read

    steps:
      - name: Download packages
        uses: actions/download-artifact@v5
        with:
          name: nuget-packages
          path: ./packages

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: HimalayanPeaks   # nuget.org profile name (not e-mail)

      - name: Push to nuget.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $packages = Get-ChildItem ./packages -Filter *.nupkg
          if (-not $packages) { throw "No packages found to publish" }
          foreach ($pkg in $packages) {
              Write-Host "Publishing $($pkg.Name)"
              dotnet nuget push $pkg.FullName `
                --source https://api.nuget.org/v3/index.json `
                --api-key $env:NUGET_API_KEY `
                --skip-duplicate
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
